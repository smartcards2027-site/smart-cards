<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقات المحاضرات</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .app-container {
      text-align: center;
      width: 90%;
      max-width: 400px;
    }

    .card-container {
      width: 100%;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
      margin: 20px 0;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s ease;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.5;
    }

    .front {
      background-color: #ffffff;
      color: #2c3e50;
      border: 2px solid #e0e6ed;
    }

    .back {
      background-color: #0088cc;
      color: #ffffff;
      transform: rotateY(180deg);
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    button {
      padding: 10px 24px;
      border: none;
      background-color: #0088cc;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h2 id="lecture-title">المحاضرة الأولى: cardiology1</h2>

    <div class="card-container" onclick="flipCard()">
      <div class="card" id="card">
        <div class="front" id="question">اضغط لقلب البطاقة</div>
        <div class="back" id="answer">...</div>
      </div>
    </div>

    <div class="controls">
      <button onclick="prevCard()">السابق</button>
      <span id="counter">0 / 0</span>
      <button onclick="nextCard()">التالي</button>
    </div>
  </div>

  <script>
    const cards = [
      {
        "id": 1,
        "question": "ما هو المسبب الأكثر شيوعاً للتضيق التاجي (Mitral Stenosis)؟",
        "answer": "الحمى الرثوية (Rheumatic Fever)."
      },
      {
        "id": 2,
        "question": "ما هي العلامة السريرية المميزة للنبض التناقضي (Pulsus Paradoxus)؟",
        "answer": "انخفاض الضغط الانقباضي بأكثر من 10 ملم زئبقي أثناء الشهيق."
      }
    ];

    let currentIndex = 0;

    function renderCard() {
      if (cards.length === 0) return;
      document.getElementById('question').innerText = cards[currentIndex].question;
      document.getElementById('answer').innerText = cards[currentIndex].answer;
      document.getElementById('counter').innerText =` ${currentIndex + 1} / ${cards.length}`;
      document.getElementById('card').classList.remove('flipped');
    }

    function flipCard() {
      document.getElementById('card').classList.toggle('flipped');
    }

    function nextCard() {
      if (cards.length === 0) return;
      currentIndex = (currentIndex + 1) % cards.length;
      renderCard();
    }

    function prevCard() {
      if (cards.length === 0) return;
      currentIndex = (currentIndex - 1 + cards.length) % cards.length;
      renderCard();
    }

    // تشغيل القراءة فوراً
    renderCard();
  </script>
</body>
</html>
